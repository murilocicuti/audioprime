# On a vX.Y.Z tag push, builds the universal app and publishes AudioPrime.zip to the release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build
          shasum -a 256 AudioPrime.zip > AudioPrime.zip.sha256
          gh release create "$GITHUB_REF_NAME" AudioPrime.zip AudioPrime.zip.sha256 \
            --title "AudioPrime ${GITHUB_REF_NAME#v}" \
            --generate-notes
