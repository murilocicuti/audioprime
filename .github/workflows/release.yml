# Ao enviar uma tag vX.Y.Z, compila o app universal e publica AudioPrime.zip na release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build.sh

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build
          shasum -a 256 AudioPrime.zip > AudioPrime.zip.sha256
          gh release create "$GITHUB_REF_NAME" AudioPrime.zip AudioPrime.zip.sha256 \
            --title "AudioPrime ${GITHUB_REF_NAME#v}" \
            --generate-notes
